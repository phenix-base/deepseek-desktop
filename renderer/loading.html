<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http://127.0.0.1:3080;" />
  <title>正在启动 DeepSeek Harness…</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .container {
      text-align: center;
      user-select: none;
    }
    /* CSS 动画 spinner */
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 24px;
      border: 4px solid rgba(230, 237, 243, 0.15);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" role="status" aria-label="加载中"></div>
    <h1>正在启动 DeepSeek Harness…</h1>
    <p class="hint">首次启动需要初始化 dsh web 服务</p>
  </div>

  <!-- 兜底跳转：主进程会主动 loadURL，这里作为双保险 -->
  <script>
    (function () {
      // 主进程通过 query 传入当前状态文案（如"正在安装 deepseek-harness…"）
      var params = new URLSearchParams(location.search);
      var msg = params.get("msg");
      var hint = params.get("hint");
      if (msg) document.querySelector("h1").textContent = msg;
      if (hint) document.querySelector(".hint").textContent = hint;

      var TARGET = "http://127.0.0.1:3080/";
      var interval = setInterval(function () {
        fetch(TARGET, { mode: "no-cors" })
          .then(function () {
            clearInterval(interval);
            location.replace(TARGET);
          })
          .catch(function () { /* 服务未就绪，继续等待 */ });
      }, 2000);
    })();
  </script>
</body>
</html>
