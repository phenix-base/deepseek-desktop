<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file: data:; connect-src http://127.0.0.1:3080;" />
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #050914;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* ---- 背景：深海极光 ---- */
    .aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 45% at 50% 38%, rgba(77, 107, 254, 0.16), transparent 70%),
        radial-gradient(ellipse 45% 35% at 22% 78%, rgba(56, 189, 248, 0.07), transparent 70%),
        radial-gradient(ellipse 45% 35% at 80% 72%, rgba(129, 140, 248, 0.08), transparent 70%);
      animation: auroraDrift 12s ease-in-out infinite alternate;
    }
    @keyframes auroraDrift {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-14px) scale(1.04); }
    }
    /* 细微噪点网格，增加质感 */
    .aurora::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 55% 45% at 50% 42%, #000 20%, transparent 75%);
    }

    .stage {
      position: relative;
      text-align: center;
      user-select: none;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ---- logo：光晕 + 涟漪 + 浮动 ---- */
    .logo-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 0 auto 30px;
    }
    .logo {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 22px rgba(77, 107, 254, 0.55));
      animation: float 3.2s ease-in-out infinite alternate,
        glowBreath 3.2s ease-in-out infinite alternate;
    }
    @keyframes float {
      from { transform: translateY(2px); }
      to { transform: translateY(-8px); }
    }
    @keyframes glowBreath {
      from { filter: drop-shadow(0 0 14px rgba(77, 107, 254, 0.35)); }
      to { filter: drop-shadow(0 0 30px rgba(96, 130, 255, 0.7)); }
    }
    .halo {
      position: absolute;
      inset: -34px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(77, 107, 254, 0.28), transparent 65%);
      animation: haloBreath 3.2s ease-in-out infinite alternate;
    }
    @keyframes haloBreath {
      from { transform: scale(0.92); opacity: 0.7; }
      to { transform: scale(1.08); opacity: 1; }
    }
    .ring {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(96, 130, 255, 0.5);
      border-radius: 50%;
      animation: ripple 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .ring.r2 {
      animation-delay: 1.4s;
    }
    @keyframes ripple {
      from { transform: scale(0.72); opacity: 0.55; }
      to { transform: scale(1.55); opacity: 0; }
    }

    /* ---- 文案 ---- */
    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-indent: 0.42em; /* 补偿末字符间距，保持视觉居中 */
      text-transform: uppercase;
      background: linear-gradient(90deg, #7c9bff, #c7d4ff 50%, #7c9bff);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmerText 4s linear infinite;
    }
    @keyframes shimmerText {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
    h1 {
      margin-top: 14px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #8b949e;
    }

    /* ---- 不定进度条：流光 ---- */
    .bar {
      width: 148px;
      height: 2px;
      margin: 26px auto 0;
      border-radius: 2px;
      background: rgba(230, 237, 243, 0.09);
      overflow: hidden;
    }
    .bar-shine {
      width: 42%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #6082ff, transparent);
      animation: slide 1.5s ease-in-out infinite;
    }
    @keyframes slide {
      from { transform: translateX(-110%); }
      to { transform: translateX(360%); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- 安装日志区（收到日志时展开） ---- */
    #log {
      display: none;
      width: min(560px, 84vw);
      max-height: 200px;
      margin-top: 30px;
      padding: 12px 14px;
      overflow-y: auto;
      border: 1px solid rgba(230, 237, 243, 0.08);
      border-radius: 10px;
      background: rgba(13, 17, 23, 0.72);
      color: #9da9b8;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      backdrop-filter: blur(6px);
    }
    #log.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="aurora"></div>

  <div class="stage">
    <div class="logo-wrap">
      <div class="halo"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <img class="logo" src="../assets/deepseek-logo.svg" alt="DeepSeek" />
    </div>
    <div class="brand">DeepSeek Harness</div>
    <h1>正在启动 DeepSeek Harness…</h1>
    <p class="hint">首次启动需要初始化 dsh web 服务</p>
    <div class="bar"><div class="bar-shine"></div></div>
  </div>

  <pre id="log"></pre>

  <script>
    (function () {
      // 主进程通过 query 传入当前状态文案（如"正在安装 deepseek-harness…"）
      var params = new URLSearchParams(location.search);
      var msg = params.get("msg");
      var hint = params.get("hint");
      if (msg) document.querySelector("h1").textContent = msg;
      if (hint) document.querySelector(".hint").textContent = hint;

      // preload 桥：onStatus 更新状态文案，onLog 追加到日志区
      var bridge = window.dshDesktop;
      if (bridge) {
        var logEl = document.getElementById("log");
        if (typeof bridge.onStatus === "function") {
          bridge.onStatus(function (text) {
            document.querySelector("h1").textContent = String(text);
          });
        }
        if (typeof bridge.onLog === "function") {
          bridge.onLog(function (line) {
            logEl.classList.add("visible");
            logEl.textContent += String(line).replace(/\r?\n$/, "") + "\n";
            logEl.scrollTop = logEl.scrollHeight;
          });
        }
      }

      // 兜底跳转：主进程会主动 loadURL，这里作为双保险
      var TARGET = "http://127.0.0.1:3080/";
      var interval = setInterval(function () {
        fetch(TARGET, { mode: "no-cors" })
          .then(function () {
            clearInterval(interval);
            location.replace(TARGET);
          })
          .catch(function () { /* 服务未就绪，继续等待 */ });
      }, 2000);
    })();
  </script>
</body>
</html>
