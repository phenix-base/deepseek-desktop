<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DeepSeek Harness 已锁定</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 50% 30%, #1a2332 0%, #0b0f16 60%, #06080d 100%);
    color: #e8eef7;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .card {
    background: rgba(20, 28, 42, 0.82);
    border: 1px solid rgba(120, 160, 255, 0.16);
    border-radius: 16px;
    padding: 40px 44px;
    width: 380px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
  }
  .lock-icon { font-size: 44px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #93a5c3; margin-bottom: 24px; }
  .field {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: #0d1420; color: #e8eef7;
    border: 1px solid #2a3a54; border-radius: 8px;
    outline: none; margin-bottom: 10px; text-align: center;
  }
  .field:focus { border-color: #4d7cff; }
  .btn {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
    background: linear-gradient(180deg, #3b66ff, #2b4fe0);
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .err { margin-top: 14px; font-size: 13px; min-height: 18px; color: #ff7a7a; }
  .err.ok { color: #6fd48a; }
  .hint { margin-top: 16px; font-size: 12px; color: #62748f; }
  .hint code { color: #8ba8e0; }
</style>
</head>
<body>
<div class="card">
  <div class="lock-icon">🔒</div>
  <h1 id="title">DeepSeek Harness 已锁定</h1>
  <div class="sub" id="sub">请输入密码解锁</div>

  <input class="field" id="pw" type="password" placeholder="密码" autocomplete="off" spellcheck="false" autofocus>
  <input class="field" id="pw2" type="password" placeholder="再次输入密码" autocomplete="off" spellcheck="false" style="display:none">

  <button class="btn" id="go">解锁</button>
  <div class="err" id="err"></div>
  <div class="hint">快捷键 <code>Ctrl/⌘ + Shift + L</code> 触发锁定 · 忘记密码只能重置应用</div>
</div>

<script>
(function () {
  "use strict";
  var api = window.lockScreen;
  var mode = "locked"; // 由 lock:mode 决定
  var busy = false;

  var el = {
    title: document.getElementById("title"),
    sub: document.getElementById("sub"),
    pw: document.getElementById("pw"),
    pw2: document.getElementById("pw2"),
    go: document.getElementById("go"),
    err: document.getElementById("err"),
  };

  function setErr(text) {
    el.err.textContent = text;
    el.err.classList.toggle("ok", false);
  }
  function setOk(text) {
    el.err.textContent = text;
    el.err.classList.toggle("ok", true);
  }

  function showSetupUI() {
    mode = "setup";
    el.title.textContent = "设置锁屏密码";
    el.sub.textContent = "首次使用：设置解锁密码后立即锁定";
    el.pw.placeholder = "设置密码（至少 4 位）";
    el.pw2.style.display = "block";
    el.go.textContent = "设置并锁定";
  }

  function showLockedUI() {
    mode = "locked";
    el.title.textContent = "DeepSeek Harness 已锁定";
    el.sub.textContent = "请输入密码解锁";
    el.pw.placeholder = "密码";
    el.pw2.style.display = "none";
    el.pw2.value = "";
    el.go.textContent = "解锁";
  }

  async function start() {
    api.mode().then(function (m) {
      if (m && m.mode === "setup") showSetupUI();
      else showLockedUI();
      el.pw.focus();
    }).catch(function () { showLockedUI(); });
  }

  async function onGo() {
    if (!api) { setErr("锁屏接口未加载（preload 异常，请重启应用）"); return; }
    if (busy) return;
    busy = true;
    el.go.disabled = true;
    try {
      if (mode === "setup") {
        var p1 = el.pw.value;
        var p2 = el.pw2.value;
        if (p1.length < 4) { setErr("密码至少 4 位"); return; }
        if (p1 !== p2) { setErr("两次输入不一致"); el.pw.select(); return; }
        var r = await api.set(p1);
        if (r && r.ok) {
          setOk("密码已设置，已锁定");
          el.pw.value = "";
          el.pw2.value = "";
          showLockedUI();
        } else if (r && r.reason === "too-short") {
          setErr("密码至少 4 位");
        } else {
          setErr("设置失败，请重试");
        }
        return;
      }

      // locked 模式：提交解锁
      var res = await api.submit(el.pw.value);
      if (!res) { setErr("解锁接口错误"); return; }
      if (res.ok) {
        // 解锁成功：主进程 setImmediate(unlock) 销毁锁窗并恢复主窗口
        return;
      }
      if (res.reason === "cooldown") {
        setErr("尝试过多，请 " + res.remainingSec + " 秒后再试");
      } else {
        var left = res.failsLeft;
        setErr("密码错误" + (left ? "，还可尝试 " + left + " 次" : ""));
      }
      el.pw.value = "";
    } catch (e) {
      setErr("解锁异常：" + (e && e.message ? e.message : String(e)));
    } finally {
      busy = false;
      el.go.disabled = false;
      el.pw.focus();
    }
  }

  el.go.addEventListener("click", onGo);
  el.pw.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); onGo(); }
  });
  el.pw2.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); onGo(); }
  });

  start();
})();
</script>
</body>
</html>
